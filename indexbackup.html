<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roskilde 2026 Kasser</title>

<!-- SheetJS for Excel export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #eef2f7, #dfe9f3);
    }

    .container {
        max-width: 950px;
        margin: 40px auto;
        background: rgba(255,255,255,0.9);
        padding: 25px;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        backdrop-filter: blur(8px);
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 32px;
        color: #222;
    }

    input, button {
        padding: 12px 14px;
        margin: 6px;
        border-radius: 14px;
        border: 1px solid #ddd;
        outline: none;
        font-size: 14px;
        transition: 0.2s;
    }

    input:focus {
        border-color: #6c63ff;
        box-shadow: 0 0 0 3px rgba(108,99,255,0.2);
    }

    button {
        cursor: pointer;
        border: none;
        font-weight: 600;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }

    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        margin-top: 20px;
        overflow: hidden;
        border-radius: 18px;
    }

    th, td {
        padding: 14px;
        text-align: left;
        vertical-align: top;
    }

    th {
        background: #6c63ff;
        color: white;
        font-weight: 600;
    }

    tr {
        background: white;
    }

    tr:nth-child(even) {
        background: #f7f7ff;
    }

    tr:hover {
        background: #eef0ff;
    }

    td {
        border-bottom: 1px solid #eee;
    }

    .delete {
        background: #ff4d4d;
        color: white;
        border-radius: 12px;
    }

    .plus {
        background: #2ecc71;
        color: white;
        border-radius: 12px;
    }

    .minus {
        background: #f39c12;
        color: white;
        border-radius: 12px;
    }

    .export {
        background: #333;
        color: white;
        border-radius: 14px;
    }

    .add-btn {
        background: #6c63ff;
        color: white;
        border-radius: 14px;
    }

    .edit-btn {
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 14px;
        margin-left: 6px;
    }

    .item-cell {
        width: 42%;
        min-width: 240px;
    }

    .actions-cell {
        min-width: 230px;
    }

    .comment-btn {
        background: #3498db;
        color: white;
        border-radius: 12px;
    }

    .comments-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
        max-width: 360px;
    }

    .saved-comment {
        padding: 10px 12px;
        background: #f0f7ff;
        border: 1px solid #cfe8ff;
        border-radius: 10px;
        color: #2d3748;
        font-size: 13px;
        line-height: 1.35;
        overflow-wrap: anywhere;
    }

    .comment-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 5px;
    }

    .comment-author {
        font-weight: 700;
        color: #1f5f8f;
    }

    .comment-text {
        margin: 0;
        white-space: pre-wrap;
    }

    .remove-comment {
        flex: 0 0 auto;
        margin: 0;
        padding: 5px 8px;
        border-radius: 8px;
        background: #ff4d4d;
        color: white;
        font-size: 12px;
    }

    .modal-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.35);
        z-index: 10;
    }

    .modal-overlay.open {
        display: flex;
    }

    .comment-modal {
        width: min(420px, 100%);
        background: white;
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(0,0,0,0.22);
        padding: 20px;
    }

    .comment-modal h2 {
        margin: 0 0 12px;
        color: #222;
        font-size: 22px;
    }

    .comment-modal input,
    .comment-modal textarea {
        width: 100%;
        box-sizing: border-box;
        margin: 8px 0;
    }

    .comment-modal textarea {
        min-height: 120px;
        resize: vertical;
        font-family: Arial, sans-serif;
    }

    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 10px;
    }

    .cancel-btn {
        background: #e9ecf2;
        color: #333;
    }

    .save-btn {
        background: #6c63ff;
        color: white;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Roskilde 2026 Kasser</h1>

    <div class="controls">
        <input type="text" id="itemName" placeholder="Ting">
        <input type="number" id="itemQty" placeholder="Antal">
        <input type="text" id="itemCategory" placeholder="Lokation">
        <button class="add-btn" onclick="addItem()">Tilf&oslash;j ting</button>
        <button class="export" onclick="exportExcel()">Eksport&eacute;r Excel</button>
    </div>

    <input type="text" id="search" placeholder="Find ting" oninput="renderTable()">

    <table>
        <thead>
            <tr>
                <th>Ting</th>
                <th>Lokation</th>
                <th>Antal</th>
                <th>Handlinger</th>
            </tr>
        </thead>
        <tbody id="inventoryTable"></tbody>
    </table>
</div>

<div class="modal-overlay" id="commentModal">
    <div class="comment-modal">
        <h2>Kommentar</h2>
        <input type="text" id="commentName" placeholder="Dit navn">
        <textarea id="commentText" placeholder="Skriv kommentar"></textarea>
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeCommentPopup()">Annuller</button>
            <button class="save-btn" onclick="saveCommentPopup()">Gem</button>
        </div>
    </div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    updateDoc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCl9DTQupgLcgJpR_VBNQoioj1eMtFv9tA",
  authDomain: "roskildeinventar.firebaseapp.com",
  projectId: "roskildeinventar",
  storageBucket: "roskildeinventar.firebasestorage.app",
  messagingSenderId: "537923363642",
  appId: "1:537923363642:web:32b64dfa078f4e80b2e603"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "inventory");

let inventory = [];
let activeCommentItemId = null;

onSnapshot(colRef, (snapshot) => {
    inventory = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTable();
});

window.addItem = async function () {
    const name = document.getElementById('itemName').value;
    const qty = parseInt(document.getElementById('itemQty').value);
    const category = document.getElementById('itemCategory').value;

    if (!name || isNaN(qty)) return;

    await addDoc(colRef, {
        name,
        qty,
        category,
        comments: []
    });

    document.getElementById('itemName').value = '';
    document.getElementById('itemQty').value = '';
    document.getElementById('itemCategory').value = '';
};

window.deleteItem = async function (id) {
    await deleteDoc(doc(db, "inventory", id));
};

window.changeQty = async function (id, currentQty, amount) {
    await updateDoc(doc(db, "inventory", id), {
        qty: currentQty + amount
    });
};

window.saveName = async function (id, value) {
    await updateDoc(doc(db, "inventory", id), { name: value });
};

window.saveCategory = async function (id, value) {
    await updateDoc(doc(db, "inventory", id), { category: value });
};

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getItemComments(item) {
    if (Array.isArray(item.comments)) {
        return item.comments;
    }

    if (item.commentName || item.comment) {
        return [{
            name: item.commentName || "",
            text: item.comment || "",
            createdAt: ""
        }];
    }

    return [];
}

window.openCommentPopup = function (id) {
    const item = inventory.find(i => i.id === id);
    if (!item) return;

    activeCommentItemId = id;
    document.getElementById('commentName').value = "";
    document.getElementById('commentText').value = "";
    document.getElementById('commentModal').classList.add('open');
    document.getElementById('commentName').focus();
};

window.closeCommentPopup = function () {
    activeCommentItemId = null;
    document.getElementById('commentName').value = "";
    document.getElementById('commentText').value = "";
    document.getElementById('commentModal').classList.remove('open');
};

window.saveCommentPopup = async function () {
    if (!activeCommentItemId) return;

    const item = inventory.find(i => i.id === activeCommentItemId);
    if (!item) return;

    const name = document.getElementById('commentName').value.trim();
    const text = document.getElementById('commentText').value.trim();
    if (!name && !text) return;

    await updateDoc(doc(db, "inventory", activeCommentItemId), {
        comments: [
            ...getItemComments(item),
            {
                name,
                text,
                createdAt: new Date().toISOString()
            }
        ],
        commentName: "",
        comment: ""
    });

    closeCommentPopup();
};

window.removeComment = async function (id, index) {
    const item = inventory.find(i => i.id === id);
    if (!item) return;

    const comments = getItemComments(item).filter((_, commentIndex) => commentIndex !== index);

    await updateDoc(doc(db, "inventory", id), {
        comments,
        commentName: "",
        comment: ""
    });
};

document.getElementById('commentModal').addEventListener('click', (event) => {
    if (event.target.id === 'commentModal') {
        closeCommentPopup();
    }
});

document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
        closeCommentPopup();
    }
});

window.renderTable = function () {
    const table = document.getElementById('inventoryTable');
    const search = document.getElementById('search').value.toLowerCase();

    table.innerHTML = '';

    inventory
    .filter(i => {
        const commentSearch = getItemComments(i)
            .map(comment => `${comment.name || ""} ${comment.text || ""}`)
            .join(" ")
            .toLowerCase();

        return (i.name || "").toLowerCase().includes(search) ||
            (i.category || "").toLowerCase().includes(search) ||
            commentSearch.includes(search);
    })
    .forEach(item => {
        const qty = Number.isFinite(Number(item.qty)) ? Number(item.qty) : 0;
        const comments = getItemComments(item);
        const commentHtml = comments.length
            ? `<div class="comments-list">
                    ${comments.map((comment, index) => `
                        <div class="saved-comment">
                            <div class="comment-header">
                                <span class="comment-author">${escapeHtml(comment.name || "Uden navn")}</span>
                                <button class="remove-comment" onclick="removeComment('${item.id}', ${index})">Fjern</button>
                            </div>
                            <p class="comment-text">${escapeHtml(comment.text || "")}</p>
                        </div>
                    `).join("")}
                </div>`
            : "";

        table.innerHTML += `
            <tr>
                <td class="item-cell">
                    <span contenteditable="true" onblur="saveName('${item.id}', this.innerText)">${escapeHtml(item.name)}</span>
                    ${commentHtml}
                </td>
                <td>
                    <span contenteditable="true" onblur="saveCategory('${item.id}', this.innerText)">${escapeHtml(item.category)}</span>
                </td>
                <td>
                <span id="qty-${item.id}">${qty}</span>
                <button class="edit-btn" onclick="startEditQty('${item.id}', ${qty})">&#9999;&#65039;</button>
                </td>
                <td class="actions-cell">
                    <button class="plus" onclick="changeQty('${item.id}', ${qty}, 1)">+</button>
                    <button class="minus" onclick="changeQty('${item.id}', ${qty}, -1)">-</button>
                    <button class="comment-btn" onclick="openCommentPopup('${item.id}')">Kommentar</button>
                    <button class="delete" onclick="deleteItem('${item.id}')">Slet</button>
                </td>
            </tr>
        `;
    });
};

window.exportExcel = function () {
    const data = inventory.map(i => ({
        Ting: i.name,
        Lokation: i.category,
        Antal: i.qty,
        Kommentarer: getItemComments(i)
            .map(comment => `${comment.name || "Uden navn"}: ${comment.text || ""}`)
            .join("\n")
    }));

    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Inventory");

    XLSX.writeFile(wb, "inventory.xlsx");
};
    window.startEditQty = function(id, currentQty) {
    const span = document.getElementById(`qty-${id}`);

    span.innerHTML = `
        <input
            type="number"
            id="qtyInput-${id}"
            value="${currentQty}"
            min="0"
            onblur="saveQty('${id}')"
            onkeydown="if(event.key==='Enter') { event.preventDefault(); this.blur(); }"
            style="width:70px;border-radius:10px;padding:6px;"
        >
    `;

    document.getElementById(`qtyInput-${id}`).focus();
};

window.saveQty = async function(id) {
    const input = document.getElementById(`qtyInput-${id}`);
    if (!input) return;

    const value = parseInt(input.value);

    await updateDoc(doc(db, "inventory", id), {
        qty: isNaN(value) ? 0 : value
    });
};
</script>

</body>
</html>
