<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roskilde 2026 Kasser</title>

<!-- SheetJS til Excel export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
    /* Grundlayout for hele siden: skrifttype, nulstilling af standardafstand og baggrund. */
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #eef2f7, #dfe9f3);
    }

    /* Hovedboksen omkring hele inventar-appen. */
    .container {
        max-width: 950px;
        margin: 40px auto;
        background: rgba(255,255,255,0.9);
        padding: 25px;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
    }

    /* Sidens overskrift. */
    h1 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 32px;
        color: #222;
    }

    /* Fælles styling for tekstfelter og knapper. */
    input, button {
        padding: 12px 14px;
        margin: 6px;
        border-radius: 14px;
        border: 1px solid #ddd;
        outline: none;
        font-size: 14px;
        transition: 0.2s;
    }

    /* Vis tydeligt hvilket inputfelt brugeren skriver i. */
    input:focus {
        border-color: #6c63ff;
        box-shadow: 0 0 0 3px rgba(108,99,255,0.2);
    }

    /* Gør alle knapper klikbare og lidt kraftigere i teksten. */
    button {
        cursor: pointer;
        border: none;
        font-weight: 600;
    }

    /* Området med inputfelter og hovedknapper øverst. */
    .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }

    /* Tabellen som viser alle tingene fra databasen. */
    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        margin-top: 20px;
        overflow: hidden;
        border-radius: 18px;
    }

    /* Fælles celle-styling for tabeloverskrifter og tabelindhold. */
    th, td {
        padding: 14px;
        text-align: left;
        vertical-align: top;
    }

    /* Den lilla overskriftsrække i tabellen. */
    th {
        background: #6c63ff;
        color: white;
        font-weight: 600;
    }

    /* Standardbaggrund for tabelrækker. */
    tr {
        background: white;
    }

    /* Giver hver anden række en svag anden farve, så tabellen er nemmere at læse. */
    tr:nth-child(even) {
        background: #f7f7ff;
    }

    /* Fremhæv den række musen er over. */
    tr:hover {
        background: #eef0ff;
    }

    /* Tynd linje under hver tabelcelle. */
    td {
        border-bottom: 1px solid #eee;
    }

    /* Rød slet-knap. */
    .delete {
        background: #ff4d4d;
        color: white;
        border-radius: 12px;
    }

    /* Grøn plus-knap til at lægge 1 til antal. */
    .plus {
        background: #2ecc71;
        color: white;
        border-radius: 12px;
    }

    /* Orange minus-knap til at trække 1 fra antal. */
    .minus {
        background: #f39c12;
        color: white;
        border-radius: 12px;
    }

    /* Mørk knap til Excel-eksport. */
    .export {
        background: #333;
        color: white;
        border-radius: 14px;
    }

    /* Lilla knap til at tilføje en ny ting. */
    .add-btn {
        background: #6c63ff;
        color: white;
        border-radius: 14px;
    }

    /* Lille redigeringsknap ved antal. */
    .edit-btn {
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 14px;
        margin-left: 6px;
    }

    /* Giver kolonnen med ting/navn mere plads. */
    .item-cell {
        width: 42%;
        min-width: 240px;
    }

    /* Sørger for at handlingsknapperne har plads nok. */
    .actions-cell {
        min-width: 230px;
    }

    /* Blå knap der åbner kommentar-popup'en. */
    .comment-btn {
        background: #3498db;
        color: white;
        border-radius: 12px;
    }

    /* Listevisning af gemte kommentarer under en ting. */
    .comments-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
        max-width: 360px;
    }

    /* En enkelt gemt kommentar. */
    .saved-comment {
        padding: 10px 12px;
        background: #f0f7ff;
        border: 1px solid #cfe8ff;
        border-radius: 10px;
        color: #2d3748;
        font-size: 13px;
        line-height: 1.35;
        overflow-wrap: anywhere;
    }

    /* Selve kommentarteksten. */
    .comment-text {
        margin: 0;
        white-space: pre-wrap;
    }

    /* Lille rød knap til at fjerne en enkelt kommentar. */
    .remove-comment {
        flex: 0 0 auto;
        margin: 0;
        padding: 5px 8px;
        border-radius: 8px;
        background: #ff4d4d;
        color: white;
        font-size: 12px;
    }

    /* Mørkt lag bag popup-vinduerne. Skjult som standard. */
    .modal-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.35);
        z-index: 10;
    }

    /* Når popup'en får class "open", bliver den vist. */
    .modal-overlay.open {
        display: flex;
    }

    /* Selve den hvide popup-boks. */
    .comment-modal {
        width: min(420px, 100%);
        background: white;
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(0,0,0,0.22);
        padding: 20px;
    }

    /* Overskrift inde i popup-vinduer. */
    .comment-modal h2 {
        margin: 0 0 12px;
        color: #222;
        font-size: 22px;
    }

    /* Inputfelter i popup'en fylder hele bredden. */
    .comment-modal input,
    .comment-modal textarea {
        width: 100%;
        box-sizing: border-box;
        margin: 8px 0;
    }

    /* Tekstfeltet til kommentarer. */
    .comment-modal textarea {
        min-height: 120px;
        resize: vertical;
        font-family: Arial, sans-serif;
    }

    /* Knaprækken nederst i popup'en. */
    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 10px;
    }

    /* Grå annuller-knap. */
    .cancel-btn {
        background: #e9ecf2;
        color: #333;
    }

    /* Lilla gem-knap. */
    .save-btn {
        background: #6c63ff;
        color: white;
    }

    /* Rød advarselsknap til farlige handlinger som fjern/slet. */
    .danger-btn {
        background: #ff4d4d;
        color: white;
    }

    /* Teksten i bekræftelses-popup'en. */
    .confirm-text {
        margin: 0 0 14px;
        color: #333;
        line-height: 1.45;
    }
</style>
</head>
<body>

<!-- Hovedindholdet på siden. -->
<div class="container">
    <h1>Roskilde 2026 Kasser</h1>

    <!-- Formularen øverst: her skriver brugeren en ny ting, antal og lokation. -->
    <div class="controls">
        <input type="text" id="itemName" placeholder="Ting">
        <input type="number" id="itemQty" placeholder="Antal">
        <input type="text" id="itemCategory" placeholder="Lokation">
        <input type="text" id="itemBoxNumber" placeholder="Kassenummer">
        <button class="add-btn" onclick="addItem()">Tilf&oslash;j ting</button>
        <button class="export" onclick="exportExcel()">Eksport&eacute;r Excel</button>
    </div>

    <!-- Søgefeltet filtrerer tabellen hver gang brugeren skriver. -->
    <input type="text" id="search" placeholder="Find ting" oninput="renderTable()">

    <!-- Tabellen bliver fyldt dynamisk med JavaScript ud fra Firestore-data. -->
    <table>
        <thead>
            <tr>
                <th>Antal</th>
                <th style="cursor:pointer;" onclick="toggleSort('name')">
                    Ting <span class="sort-icon" data-sort-field="name">↕</span>
                </th>
                <th style="cursor:pointer;" onclick="toggleSort('category')">
                    Lokation <span class="sort-icon" data-sort-field="category">↕</span>
                </th>
                <th style="cursor:pointer;" onclick="toggleSort('boxNumber')">
                    Kassenummer <span class="sort-icon" data-sort-field="boxNumber">↕</span>
                </th>
                <th>Handlinger</th>
            </tr>
        </thead>
        <tbody id="inventoryTable"></tbody>
    </table>
</div>

<!-- Popup til at skrive og gemme en kommentar til en ting. -->
<div class="modal-overlay" id="commentModal">
    <div class="comment-modal">
        <h2>Kommentar</h2>
        <textarea id="commentText" placeholder="Skriv kommentar"></textarea>
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeCommentPopup()">Annuller</button>
            <button class="save-btn" onclick="saveCommentPopup()">Gem</button>
        </div>
    </div>
</div>

<!-- Popup der spørger, før en kommentar bliver fjernet. -->
<div class="modal-overlay" id="removeCommentModal">
    <div class="comment-modal">
        <h2>Fjern kommentar?</h2>
        <p class="confirm-text">Er du sikker på, at du vil fjerne denne kommentar?</p>
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeRemoveCommentPopup()">Annuller</button>
            <button class="danger-btn" onclick="confirmRemoveComment()">Fjern</button>
        </div>
    </div>
</div>

<!-- FIREBASE -->
<script type="module">
/* Importerer Firebase-app og de Firestore-funktioner siden bruger. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    updateDoc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* Firebase-konfigurationen fortæller siden hvilket Firebase-projekt den skal bruge. */
const firebaseConfig = {
  apiKey: "AIzaSyCl9DTQupgLcgJpR_VBNQoioj1eMtFv9tA",
  authDomain: "roskildeinventar.firebaseapp.com",
  projectId: "roskildeinventar",
  storageBucket: "roskildeinventar.firebasestorage.app",
  messagingSenderId: "537923363642",
  appId: "1:537923363642:web:32b64dfa078f4e80b2e603"
};

/* Starter Firebase, henter Firestore-databasen og peger på collection "inventory". */
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "inventory");

/* Lokale variabler der holder den data og popup-tilstand siden arbejder med. */
let inventory = [];
let activeCommentItemId = null;
let pendingRemoveComment = null;
let sortField = null;
let sortDirection = 'asc';

/* Lytter live på Firestore. Når databasen ændrer sig, opdateres inventory og tabellen tegnes igen. */
onSnapshot(colRef, (snapshot) => {
    inventory = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTable();
});

/* Tilføjer en ny ting til Firestore ud fra felterne øverst på siden. */
window.addItem = async function () {
    const name = document.getElementById('itemName').value;
    const qty = parseInt(document.getElementById('itemQty').value);
    const category = document.getElementById('itemCategory').value;
    const boxNumber = document.getElementById('itemBoxNumber').value;

    /* Stopper funktionen hvis der mangler navn, eller hvis antal ikke er et tal. */
    if (!name || isNaN(qty)) return;

    /* Gemmer den nye ting i databasen med en tom kommentarliste. */
    await addDoc(colRef, {
        name,
        qty,
        category,
        boxNumber,
        comments: []
    });

    /* Tømmer inputfelterne efter en ting er blevet tilføjet. */
    document.getElementById('itemName').value = '';
    document.getElementById('itemQty').value = '';
    document.getElementById('itemCategory').value = '';
    document.getElementById('itemBoxNumber').value = '';
};

window.toggleSort = function (field) {
    if (sortField === field) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
    } else {
        sortField = field;
        sortDirection = 'asc';
    }

    document.querySelectorAll('.sort-icon').forEach(icon => {
        const fieldName = icon.getAttribute('data-sort-field');
        if (fieldName === sortField) {
            icon.textContent = sortDirection === 'asc' ? '⬆' : '⬇';
        } else {
            icon.textContent = '↕';
        }
    });

    renderTable();
};

/* Sletter en hel ting fra Firestore ud fra dens dokument-id. */
window.deleteItem = async function (id) {
    await deleteDoc(doc(db, "inventory", id));
};

/* Ændrer antal med plus eller minus. amount er typisk 1 eller -1. */
window.changeQty = async function (id, currentQty, amount) {
    await updateDoc(doc(db, "inventory", id), {
        qty: currentQty + amount
    });
};

/* Gemmer et redigeret navn, når brugeren klikker væk fra navnefeltet. */
window.saveName = async function (id, value) {
    await updateDoc(doc(db, "inventory", id), { name: value });
};

/* Gemmer en redigeret lokation, når brugeren klikker væk fra lokationsfeltet. */
window.saveCategory = async function (id, value) {
    await updateDoc(doc(db, "inventory", id), { category: value });
};

/* Gemmer et redigeret kassenummer, når brugeren klikker væk fra feltet. */
window.saveBoxNumber = async function (id, value) {
    await updateDoc(doc(db, "inventory", id), { boxNumber: value });
};

/* Gør tekst sikker at sætte ind i HTML, så specialtegn ikke ødelægger siden. */
function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* Henter kommentarer for en ting og håndterer også gamle datafelter fra tidligere versioner. */
function getItemComments(item) {
    /* Ny version: kommentarer ligger som en liste. */
    if (Array.isArray(item.comments)) {
        return item.comments;
    }

    /* Gammel version: der fandtes kun én kommentar med commentName/comment. */
    if (item.commentName || item.comment) {
        return [{
            name: item.commentName || "",
            text: item.comment || "",
            createdAt: ""
        }];
    }

    return [];
}

/* Åbner kommentarpopup'en for den valgte ting. */
window.openCommentPopup = function (id) {
    const item = inventory.find(i => i.id === id);
    if (!item) return;

    /* Gemmer hvilken ting kommentaren skal høre til og nulstiller popup-feltet. */
    activeCommentItemId = id;
    document.getElementById('commentText').value = "";
    document.getElementById('commentModal').classList.add('open');
    document.getElementById('commentText').focus();
};

/* Lukker kommentarpopup'en og rydder midlertidige værdier. */
window.closeCommentPopup = function () {
    activeCommentItemId = null;
    document.getElementById('commentText').value = "";
    document.getElementById('commentModal').classList.remove('open');
};

/* Gemmer en ny kommentar på den ting der er aktiv i popup'en. */
window.saveCommentPopup = async function () {
    if (!activeCommentItemId) return;

    const item = inventory.find(i => i.id === activeCommentItemId);
    if (!item) return;

    /* trim() fjerner mellemrum i starten og slutningen af felterne. */
    const text = document.getElementById('commentText').value.trim();
    if (!text) return;

    /* Tilføjer den nye kommentar til den eksisterende kommentarliste. */
    await updateDoc(doc(db, "inventory", activeCommentItemId), {
        comments: [
            ...getItemComments(item),
            {
                text,
                createdAt: new Date().toISOString()
            }
        ],
        commentName: "",
        comment: ""
    });

    /* Lukker popup'en efter kommentaren er gemt. */
    closeCommentPopup();
};

/* Åbner bekræftelses-popup'en for at fjerne en bestemt kommentar. */
window.openRemoveCommentPopup = function (id, index) {
    pendingRemoveComment = { id, index };
    document.getElementById('removeCommentModal').classList.add('open');
};

/* Lukker fjern-kommentar-popup'en uden at slette noget. */
window.closeRemoveCommentPopup = function () {
    pendingRemoveComment = null;
    document.getElementById('removeCommentModal').classList.remove('open');
};

/* Fjerner den kommentar brugeren har valgt, efter bekræftelse. */
window.confirmRemoveComment = async function () {
    if (!pendingRemoveComment) return;

    const { id, index } = pendingRemoveComment;
    const item = inventory.find(i => i.id === id);
    if (!item) {
        closeRemoveCommentPopup();
        return;
    }

    /* Beholder alle kommentarer undtagen den med det valgte index. */
    const comments = getItemComments(item).filter((_, commentIndex) => commentIndex !== index);

    /* Opdaterer dokumentet i Firestore med den nye kommentarliste. */
    await updateDoc(doc(db, "inventory", id), {
        comments,
        commentName: "",
        comment: ""
    });

    closeRemoveCommentPopup();
};

/* Hvis brugeren klikker på det mørke område uden for kommentarpopup'en, lukkes den. */
document.getElementById('commentModal').addEventListener('click', (event) => {
    if (event.target.id === 'commentModal') {
        closeCommentPopup();
    }
});

/* Hvis brugeren klikker på det mørke område uden for fjern-popup'en, lukkes den. */
document.getElementById('removeCommentModal').addEventListener('click', (event) => {
    if (event.target.id === 'removeCommentModal') {
        closeRemoveCommentPopup();
    }
});

/* Escape-tasten lukker begge popups. */
document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
        closeCommentPopup();
        closeRemoveCommentPopup();
    }
});

/* Tegner hele tabellen ud fra inventory-listen og det aktuelle søgefelt. */
window.renderTable = function () {
    const table = document.getElementById('inventoryTable');
    const search = document.getElementById('search').value.toLowerCase();

    /* Rydder tabellen, så den kan bygges op igen fra bunden. */
    table.innerHTML = '';

    inventory
    /* Filtrerer ting efter navn, lokation eller tekst i kommentarer. */
    .filter(i => {
        const commentSearch = getItemComments(i)
            .map(comment => `${comment.text || ""}`)
            .join(" ")
            .toLowerCase();

        return (i.name || "").toLowerCase().includes(search) ||
            (i.category || "").toLowerCase().includes(search) ||
            (i.boxNumber || "").toLowerCase().includes(search) ||
            commentSearch.includes(search);
    })
    /* Sorterer efter kategori hvis sorteringsfunktionen er aktiv. */
    .sort((a, b) => {
        if (!sortField) return 0;

        let valueA;
        let valueB;

        if (sortField === 'qty') {
            valueA = Number(a.qty) || 0;
            valueB = Number(b.qty) || 0;
        } else {
            valueA = (a[sortField] || "").toString().toLowerCase();
            valueB = (b[sortField] || "").toString().toLowerCase();
        }

        if (valueA === valueB) return 0;
        if (sortDirection === 'asc') {
            return valueA < valueB ? -1 : 1;
        }
        return valueA > valueB ? -1 : 1;
    })
    /* Opretter en tabelrække for hver ting der matcher søgningen. */
    .forEach(item => {
        /* Sikrer at antal altid vises som et tal. */
        const qty = Number.isFinite(Number(item.qty)) ? Number(item.qty) : 0;
        const comments = getItemComments(item);

        /* Bygger HTML for kommentarer, hvis tingen har nogen. */
        const commentHtml = comments.length
            ? `<div class="comments-list">
                    ${comments.map((comment, index) => `
                        <div class="saved-comment">
                            <p class="comment-text">${escapeHtml(comment.text || "")}</p>
                            <button class="remove-comment" onclick="openRemoveCommentPopup('${item.id}', ${index})">Fjern</button>
                        </div>
                    `).join("")}
                </div>`
            : "";

        /* Tilføjer rækken til tabellen med redigerbare felter og handlingsknapper. */
        table.innerHTML += `
            <tr>
                <td>
                    <span id="qty-${item.id}">${qty}</span>
                    <button class="edit-btn" onclick="startEditQty('${item.id}', ${qty})">&#9999;&#65039;</button>
                </td>
                <td class="item-cell">
                    <span contenteditable="true" onblur="saveName('${item.id}', this.innerText)">${escapeHtml(item.name)}</span>
                    ${commentHtml}
                </td>
                <td>
                    <span contenteditable="true" onblur="saveCategory('${item.id}', this.innerText)">${escapeHtml(item.category)}</span>
                </td>
                <td>
                    <span contenteditable="true" onblur="saveBoxNumber('${item.id}', this.innerText)">${escapeHtml(item.boxNumber || '')}</span>
                </td>
                <td class="actions-cell">
                    <button class="plus" onclick="changeQty('${item.id}', ${qty}, 1)">+</button>
                    <button class="minus" onclick="changeQty('${item.id}', ${qty}, -1)">-</button>
                    <button class="comment-btn" onclick="openCommentPopup('${item.id}')">Kommentar</button>
                    <button class="delete" onclick="deleteItem('${item.id}')">Slet</button>
                </td>
            </tr>
        `;
    });
};

/* Eksporterer alle ting og kommentarer til en Excel-fil. */
window.exportExcel = function () {
    /* Laver inventory om til kolonner der passer til Excel-arket. */
    const data = inventory.map(i => ({
        Antal: i.qty,
        Ting: i.name,
        Lokation: i.category,
        Kassenummer: i.boxNumber || "",
        Kommentarer: getItemComments(i)
            .map(comment => `${comment.text || ""}`)
            .join("\n")
    }));

    /* SheetJS laver et worksheet og en workbook ud fra data. */
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Inventory");

    /* Filnavnet får dags dato, så eksporter er nemme at kende fra hinanden. */
    const today = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `roskilde 2026 kasser ${today}.xlsx`);
};

/* Skifter antal-visningen til et inputfelt, så brugeren kan skrive et præcist tal. */
window.startEditQty = function(id, currentQty) {
    const span = document.getElementById(`qty-${id}`);

    /* Erstatter tallet med et inputfelt der gemmer ved blur eller Enter. */
    span.innerHTML = `
        <input
            type="number"
            id="qtyInput-${id}"
            value="${currentQty}"
            min="0"
            onblur="saveQty('${id}')"
            onkeydown="if(event.key==='Enter') { event.preventDefault(); this.blur(); }"
            style="width:70px;border-radius:10px;padding:6px;"
        >
    `;

    document.getElementById(`qtyInput-${id}`).focus();
};

/* Gemmer det antal der blev skrevet i det lille redigeringsfelt. */
window.saveQty = async function(id) {
    const input = document.getElementById(`qtyInput-${id}`);
    if (!input) return;

    const value = parseInt(input.value);

    /* Hvis værdien ikke er et gyldigt tal, gemmes 0 i stedet. */
    await updateDoc(doc(db, "inventory", id), {
        qty: isNaN(value) ? 0 : value
    });
};
</script>

</body>
</html>
