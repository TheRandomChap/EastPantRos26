<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roskilde 2026 Kasser</title>
    <link rel="stylesheet" href="styles.css">

    <!-- SheetJS til Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <!-- SQL.js for SQLite i browseren -->
    <script src="https://sql.js.org/dist/sql-wasm.js"></script>
</head>
<body>

<!-- Hovedindholdet på siden. -->
<div class="container">
    <h1>Roskilde 2026 Kasser</h1>

    <!-- Formularen øverst: her skriver brugeren en ny ting, antal og lokation. -->
    <div class="controls">
        <input type="text" id="itemName" placeholder="Ting">
        <input type="number" id="itemQty" placeholder="Antal">
        <input type="text" id="itemCategory" placeholder="Lokation">
        <input type="text" id="itemBoxNumber" placeholder="Kassenummer">
        <button class="add-btn" onclick="addItem()">Tilføj ting</button>
        <button class="export" onclick="exportExcel()">Eksportér Excel</button>
        <button class="export" onclick="downloadDatabase()" style="background: #27ae60;">Højst Gem Database</button>
    </div>

    <!-- Søgefeltet filtrerer tabellen hver gang brugeren skriver. -->
    <input type="text" id="search" placeholder="Find ting" oninput="renderTable()">

    <!-- Tabellen bliver fyldt dynamisk med JavaScript ud fra database-data. -->
    <table>
        <thead>
            <tr>
                <th>Antal</th>
                <th style="cursor:pointer;" onclick="toggleSort('name')">
                    Ting <span class="sort-icon" data-sort-field="name">↕</span>
                </th>
                <th style="cursor:pointer;" onclick="toggleSort('category')">
                    Lokation <span class="sort-icon" data-sort-field="category">↕</span>
                </th>
                <th style="cursor:pointer;" onclick="toggleSort('boxNumber')">
                    Kassenummer <span class="sort-icon" data-sort-field="boxNumber">↕</span>
                </th>
                <th>Handlinger</th>
            </tr>
        </thead>
        <tbody id="inventoryTable"></tbody>
    </table>
</div>

<!-- Popup til at skrive og gemme en kommentar til en ting. -->
<div class="modal-overlay" id="commentModal">
    <div class="comment-modal">
        <h2>Kommentar</h2>
        <textarea id="commentText" placeholder="Skriv kommentar"></textarea>
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeCommentPopup()">Annuller</button>
            <button class="save-btn" onclick="saveCommentPopup()">Gem</button>
        </div>
    </div>
</div>

<!-- Popup der spørger, før en kommentar bliver fjernet. -->
<div class="modal-overlay" id="removeCommentModal">
    <div class="comment-modal">
        <h2>Fjern kommentar?</h2>
        <p class="confirm-text">Er du sikker på, at du vil fjerne denne kommentar?</p>
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeRemoveCommentPopup()">Annuller</button>
            <button class="danger-btn" onclick="confirmRemoveComment()">Fjern</button>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
